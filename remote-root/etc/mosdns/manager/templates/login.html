<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · {{ site_name or "Mosctl" }}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="icon" href="{{ url_for('static', filename='mosctl-logo.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='mosctl-logo-512.png') }}" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='mosctl-logo-512.png') }}">
  <script>
    (function () {
      let pref = 'auto';
      try { pref = localStorage.getItem('theme') || 'auto'; } catch (e) {}
      const dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    /* 零依赖 CSS，保证无网也能渲染；配色与面板一致 */
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0c0f; --surface: #12161b; --line: #222932; --line-2: #2d3540;
      --text: #e8ebef; --muted: #8a94a1; --faint: #5f6875;
      --accent: #3ecf8e; --accent-ink: #05140c; --accent-soft: rgba(62,207,142,.14);
      --input-bg: #0e1216; --danger: #f06464; --shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #f4f6f8; --surface: #ffffff; --line: #e6e9ee; --line-2: #d9dee5;
      --text: #14181d; --muted: #636d79; --faint: #98a1ac;
      --accent: #12a26a; --accent-ink: #ffffff; --accent-soft: rgba(18,162,106,.12);
      --input-bg: #ffffff; --danger: #d64545; --shadow: 0 20px 50px rgba(16,24,40,.10);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 20px;
      display: grid; place-items: center;
      background: radial-gradient(1200px 500px at 50% -10%, var(--accent-soft), transparent 70%), var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .login-card { width: 100%; max-width: 360px; padding: 28px 26px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .brand img { width: 40px; height: 40px; border-radius: 10px; }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 650; }
    .brand p { margin: 1px 0 0; color: var(--muted); font-size: 12.5px; }
    label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 550; }
    input { width: 100%; height: 40px; margin-bottom: 14px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--input-bg); color: var(--text); font: inherit; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    button { width: 100%; height: 40px; margin-top: 6px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(.95); }
    .error { margin-bottom: 14px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); font-size: 13px; }
  </style>
</head>
<body>
  <form class="login-card" method="post">
    <div class="brand">
      <img src="{{ url_for('static', filename='mosctl-logo.svg') }}" alt="Mosctl">
      <div>
        <h1>{{ site_name or "Mosctl" }}</h1>
        <p>mosdns 解析管理面板</p>
      </div>
    </div>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">登录</button>
  </form>
</body>
</html>
