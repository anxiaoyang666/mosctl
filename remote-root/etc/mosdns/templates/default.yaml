# mosctl-template: 4
log:
  level: info
  file: "/var/log/mosdns.log"

api:
  http: "127.0.0.1:8080"

plugins:
  # 基础缓存
  - tag: cache
    type: cache
    args:
      size: 20480
      lazy_cache_ttl: 86400
      dump_file: "/etc/mosdns/cache.dump"
      dump_interval: 600

  # 国内上游：主上游 + 备用上游。concurrent 是同时并发查询的上游数（mosdns v5 forward
  # 插件字段，上限 3），设成 2 时两个上游一起查、取先返回的成功结果，主上游超时不再拖慢解析
  - tag: forward_local
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "udp://119.29.29.29" # TAG_LOCAL
          enable_pipeline: true
        - addr: "udp://223.5.5.5" # TAG_LOCAL_BACKUP

  # 国外上游
  - tag: forward_remote
    type: forward
    args:
      upstreams:
        - addr: "8.8.8.8:53" # TAG_REMOTE

  # 强制国内规则，优先级高于 geosite
  - tag: force_cn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rules/force-cn.txt"

  # 强制国外规则，优先级高于 geosite
  - tag: force_no_cn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rules/force-nocn.txt"

  # 国内域名规则
  - tag: geosite_cn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rules/geosite_cn.txt"

  # 国外域名规则
  - tag: geosite_no_cn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rules/geosite_no_cn.txt"

  # 本地 hosts，规则定义排序放在最后，执行时仍优先用于本地覆盖
  - tag: hosts
    type: hosts
    args:
      files:
        - "/etc/mosdns/rules/hosts.txt"

  # 拒绝 HTTPS/SVCB 记录（qtype 65）：这类记录可带 ipv4hint/ipv6hint/ECH 真实地址，
  # 浏览器会直接拿去连，绕过 mihomo 的 fake-ip。用 reject 0 回空的 NOERROR（NODATA）：
  # mosdns v5 的 reject <rcode> 只是 SetReply 后设置 rcode、不带任何记录；
  # 不用 reject 3（NXDOMAIN），NXDOMAIN 表示"整个域名不存在"，客户端可能连同 A/AAAA 一起负缓存
  - tag: reject_https_record
    type: sequence
    args:
      - matches: qtype 65
        exec: reject 0

  - tag: has_resp_sequence
    type: sequence
    args:
      - matches: has_resp
        exec: accept

  - tag: no_ecs
    type: ecs_handler
    args:
      forward: false
      preset: ""
      send: false

  - tag: cached_local_sequence
    type: sequence
    args:
      - exec: $cache
      - matches: has_resp
        exec: accept
      - exec: $forward_local

  - tag: forward_remote_upstream
    type: sequence
    args:
      - exec: $no_ecs
      - exec: prefer_ipv4
      - exec: $forward_remote

  - tag: query_is_force_cn_domain
    type: sequence
    args:
      - matches: qname $force_cn
        exec: $forward_local

  - tag: query_is_force_no_cn_domain
    type: sequence
    args:
      - matches: qname $force_no_cn
        exec: $forward_remote_upstream

  - tag: query_is_local_domain
    type: sequence
    args:
      - matches: qname $geosite_cn
        exec: $cached_local_sequence

  - tag: query_is_no_local_domain
    type: sequence
    args:
      - matches: qname $geosite_no_cn
        exec: $forward_remote_upstream

  - tag: main_sequence
    type: sequence
    args:
      - exec: $hosts
      - exec: jump has_resp_sequence

      - exec: $reject_https_record
      - exec: jump has_resp_sequence

      - exec: $query_is_force_cn_domain
      - exec: jump has_resp_sequence

      - exec: $query_is_force_no_cn_domain
      - exec: jump has_resp_sequence

      - exec: $query_is_local_domain
      - exec: jump has_resp_sequence

      - exec: $query_is_no_local_domain
      - exec: jump has_resp_sequence

      - exec: $forward_remote_upstream

  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: ":53"

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: ":53"
